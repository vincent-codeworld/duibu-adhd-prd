openapi: 3.0.3
info:
  title: 兑步 API
  version: 0.9.0
  description: |
    Persistence: default STORE_DRIVER=postgres (DATABASE_URL); STORE_DRIVER=memory for ephemeral local/tests.
    Invite-code failure rate limit (INVITE_CODE_MAX_FAILS_PER_HOUR, default 10): postgres persists invite_code_failures across API restarts; memory is process-local. Client errors unchanged (404 invalid_invite_code, 429 too_many_failed_invite_attempts).

    MVP 服务端契约（对齐当前 Go 实现；PRD v1.1 StepBuddy）。
    任务必填 dueAt；阶段可选 remindAt（宜 ≤ dueAt，超出 400）。
    有验收人时 POST /tasks/{id}/complete → 403 verification required；任务 completed 仅当 task_completion 验收通过。
    验收人接口不得返回任务备注。仅设备任务不出网。AI 只接收 title/notes。
    AUTH_MODE=stub 时可用 /v1/auth/dev，且 /v1/auth/apple 与 /v1/auth/google 把 identityToken 当各自 provider 的 subject（互不合并）。
    AUTH_MODE=apple 时校验 Apple identityToken（JWKS），需配置 APPLE_CLIENT_ID（MVP Bundle：`com.stepbuddy.app`）；
    同时校验 Google ID token，需配置 GOOGLE_CLIENT_ID（iOS OAuth client ID）。未配置对应 client ID 时该登录接口 503，不放行未校验 token。
    Apple 与 Google 按各自 sub 分账号，不会按 email 静默绑定。
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  authMode:
                    type: string
                    enum: [stub, apple]
                    description: apple 表示校验 Apple 与 Google ID token；stub 表示联调明文 subject。

  /v1/auth/dev:
    post:
      summary: Stub-only login (AUTH_MODE=stub)
      description: Creates or returns an account keyed by subject; issues JWT. 404 when AUTH_MODE≠stub.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string }
                nickname: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: subject required / bad nickname
        "404":
          description: Not available outside stub mode

  /v1/auth/apple:
    post:
      summary: Sign in with Apple
      description: |
        AUTH_MODE=stub：identityToken 当作稳定 Apple subject 字符串，签发 JWT（联调用）。
        AUTH_MODE=apple：校验 Apple identityToken（iss=https://appleid.apple.com，aud∈APPLE_CLIENT_ID[/S]，RS256+JWKS），
        按 sub 创建或绑定账号并签发应用 JWT。App 只需传 ASAuthorizationAppleIDCredential.identityToken（UTF-8 字符串）与可选 nickname。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken: { type: string, description: Apple identityToken JWT }
                nickname: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: identityToken required
        "401":
          description: invalid Apple identityToken
        "503":
          description: AUTH_MODE=apple but APPLE_CLIENT_ID not configured

  /v1/auth/google:
    post:
      summary: Sign in with Google
      description: |
        请求体与 Apple 相同：`identityToken` + 可选 `nickname`。响应与 Apple/stub 相同（AuthResponse）。
        AUTH_MODE=stub：identityToken 当作稳定 Google subject 字符串，签发应用 JWT（联调用，不需要真实 Google token 或 GOOGLE_CLIENT_ID）。
        该 subject 只写入 google_subject，不会按邮箱、或与 Apple 相同的字符串，绑定已有 Apple 账号。
        AUTH_MODE=apple：校验 Google ID token（RS256，JWKS `https://www.googleapis.com/oauth2/v3/certs`，
        iss 为 `https://accounts.google.com` 或 `accounts.google.com`，aud ∈ GOOGLE_CLIENT_ID[/S]，
        若 token 含 azp 则 azp 也必须 ∈ 这些 client ID，exp 必填，允许 30s 时钟偏差）。
        通过后只按 Google `sub` 创建或返回账号。未配置 GOOGLE_CLIENT_ID 时 503，不会把未校验字符串当成 subject。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken:
                  type: string
                  description: Google ID token JWT。stub 模式下为任意稳定 subject 字符串。
                nickname: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: identityToken required / bad nickname
        "401":
          description: invalid Google ID token
        "503":
          description: AUTH_MODE=apple but GOOGLE_CLIENT_ID not configured

  /v1/me:
    get:
      summary: Current account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401":
          description: Unauthorized
    patch:
      summary: Update nickname
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400":
          description: Invalid body / nickname
        "401":
          description: Unauthorized

  /v1/me/invite-code:
    get:
      summary: Current invite code
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Invite code
          content:
            application/json:
              schema:
                type: object
                required: [inviteCode]
                properties:
                  inviteCode: { type: string }
        "401":
          description: Unauthorized

  /v1/me/invite-code/reset:
    post:
      summary: Reset invite code (old codes invalidate)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: New invite code
          content:
            application/json:
              schema:
                type: object
                required: [inviteCode]
                properties:
                  inviteCode: { type: string }
        "400":
          description: Reset failed
        "401":
          description: Unauthorized

  /v1/friends:
    get:
      summary: List friends
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Friend list
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items: { $ref: "#/components/schemas/FriendListItem" }
        "401":
          description: Unauthorized
    post:
      summary: Add friend by invite code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode: { type: string }
      responses:
        "201":
          description: Friendship created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddFriendResponse" }
        "200":
          description: Already friends
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddFriendResponse" }
        "400":
          description: cannot_add_yourself / other validation
        "403":
          description: blocked
        "404":
          description: invalid_invite_code
        "429":
          description: too_many_failed_invite_attempts
        "401":
          description: Unauthorized

  /v1/friends/{friendshipID}:
    delete:
      summary: Remove friendship
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: friendshipID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed
        "403":
          description: forbidden
        "404":
          description: not_found
        "401":
          description: Unauthorized

  /v1/blocks:
    post:
      summary: Block an account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId: { type: string, format: uuid }
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: blocked }
        "400":
          description: accountId required / other
        "401":
          description: Unauthorized

  /v1/tasks:
    get:
      summary: List synced tasks for me
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/TaskView" }
        "401":
          description: Unauthorized
    post:
      summary: Upload/create synced task (requires uploadConsent)
      description: Must not be called for device-only tasks without explicit consent.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "400":
          description: Validation error
        "403":
          description: uploadConsent required
        "401":
          description: Unauthorized

  /v1/tasks/{taskID}:
    parameters:
      - in: path
        name: taskID
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get synced task (owner). Notes included for owner only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "404":
          description: not_found
        "401":
          description: Unauthorized
    patch:
      summary: Update synced task (title/notes/stages progress/rewards)
      description: |
        Stages if provided must remain 3–7 items; progress = pending|done|skipped.
        Stage id is stable by position when patching progress (勾选/跳过回写).
        FR-05: cannot uncheck done→pending when reward is locked (pending/approved/rejected/self_redeemed).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchTaskInput" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "400":
          description: Validation / cannot uncheck locked stage
        "404":
          description: not_found
        "401":
          description: Unauthorized
    delete:
      summary: Delete synced task and related materials
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Deleted
        "404":
          description: not_found
        "401":
          description: Unauthorized

  /v1/tasks/{taskID}/complete:
    post:
      summary: Self-complete task (no designated verifier)
      description: |
        Requires ≥1 done stage and no pending stages remaining.
        If designatedVerifierAccountId is set, returns 403 `verification required` —
        complete via approving the task_completion verification instead (PRD v1.1 gate).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: taskID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "400":
          description: pending stages remain / need at least one done stage
        "403":
          description: verification required (task has designated verifier)
        "404":
          description: not_found
        "401":
          description: Unauthorized

  /v1/tasks/{taskID}/verifier:
    put:
      summary: Designate verifier (must be friend)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: taskID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId: { type: string, format: uuid }
      responses:
        "200":
          description: Task with verifier set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "400":
          description: verifier must be a friend / blocked / accountId required
        "404":
          description: not_found
        "401":
          description: Unauthorized

  /v1/uploads/screenshots:
    post:
      summary: Upload a verification screenshot (multipart)
      description: |
        Multipart field `file`. Server sniffs magic bytes (image/jpeg|png|webp), enforces ≤4MiB.
        Client should strip EXIF / compress (long edge ≤1600) before upload.
        Returns screenshotKey to pass into verification submit. Ownership recorded until attached.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [screenshotKey, contentType, byteSize]
                properties:
                  screenshotKey: { type: string, format: uuid }
                  contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                  byteSize: { type: integer }
        "400":
          description: invalid / unsupported type / empty
        "413":
          description: file too large
        "401":
          description: Unauthorized

  /v1/screenshots/{screenshotKey}:
    get:
      summary: Download screenshot bytes
      description: |
        Before attach: only uploader. After attach to a verification request: requester or that request's verifier.
        404 if missing; 403 if wrong user.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: screenshotKey
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "403":
          description: forbidden
        "404":
          description: not found
        "401":
          description: Unauthorized

  /v1/rewards/{rewardID}/verifications:
    post:
      summary: Submit verification (optional note + screenshot key)
      description: |
        Verifier-facing payload must NOT include task notes.
        screenshotKey comes from POST /v1/uploads/screenshots (must be owned by requester and not yet attached).
        App fetches bytes via GET /v1/screenshots/{screenshotKey} (requester or verifier only).
        Stage rewards: stage must be done. task_completion rewards (complete gate): stages must be ready
        (no pending, ≥1 done); task may still be active — approving sets status=completed.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: rewardID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 200 }
                screenshotKey: { type: string }
      responses:
        "201":
          description: Submitted (returns inbox-shaped item)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400":
          description: Validation / stage not done / cannot submit
        "403":
          description: forbidden
        "404":
          description: not_found
        "401":
          description: Unauthorized

  /v1/verifications/inbox:
    get:
      summary: Pending verifications for me as verifier
      description: Returns applicant nickname, task title, stage/completion label, reward text/link, note, screenshot. Never task notes.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InboxItem" }
        "401":
          description: Unauthorized

  /v1/verifications/outbox:
    get:
      summary: My submitted verification results
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Outbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OutboxItem" }
        "401":
          description: Unauthorized

  /v1/verifications/{requestID}/approve:
    post:
      summary: Approve (confirm the agreement; does not change stage progress)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: requestID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: approved }
        "400":
          description: not pending / state error
        "403":
          description: forbidden
        "404":
          description: not_found
        "401":
          description: Unauthorized

  /v1/verifications/{requestID}/reject:
    post:
      summary: Reject (stage stays done)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: requestID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolutionNote: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: rejected }
        "400":
          description: not pending / note too long
        "403":
          description: forbidden
        "404":
          description: not_found
        "401":
          description: Unauthorized

  /v1/verifications/{requestID}/withdraw:
    post:
      summary: Withdraw pending request
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: requestID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: withdrawn }
        "400":
          description: not pending
        "403":
          description: forbidden
        "404":
          description: not_found
        "401":
          description: Unauthorized

  /v1/notices:
    get:
      summary: In-app notices (PRD InAppNotice / FR-26)
      description: |
        MVP 验收结果通道。由验收域事件写入：
        verification_pending → 验收人；approved/rejected → 申请人；withdrawn → 验收人。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Notices for current user, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notice" }
                  unreadCount: { type: integer, minimum: 0 }
        "401":
          description: Unauthorized

  /v1/notices/{noticeID}/read:
    post:
      summary: Mark notice read
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: noticeID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Notice marked read (idempotent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "401":
          description: Unauthorized
        "404":
          description: not_found

  /v1/reports:
    post:
      summary: Report verification note/screenshot (PRD FR-27 / §10.12)
      description: |
        Thin MVP: authenticated party to a verification request submits a report into the
        manual review queue (memory store). Returns receipt with `message: 已收到`.
        Does not change stage progress or reward redeem state.
        Reasons: harassment(骚扰) / privacy(隐私) / illegal_content(违法内容) / other(其他).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportRequest" }
            example:
              requestId: 11111111-1111-1111-1111-111111111111
              reason: harassment
              detail: 备注不当
      responses:
        "201":
          description: Report accepted (已收到)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportReceipt" }
              example:
                id: 22222222-2222-2222-2222-222222222222
                requestId: 11111111-1111-1111-1111-111111111111
                reason: harassment
                detail: 备注不当
                createdAt: "2026-11-03T14:00:00Z"
                message: 已收到
        "400":
          description: invalid_body / invalid reason / detail too long / requestId required
        "401":
          description: Unauthorized
        "403":
          description: Reporter is not requester or verifier of the request
        "404":
          description: verification request not found

  /v1/ai/decompose:
    post:
      summary: AI stage draft (PRD FR-22/23/24, §11)
      description: |
        Only `title` and `notes` are accepted (allowlist; extra fields → 400).
        No auth required (device-only create flow can call this).
        Server budget ~8s: on timeout, provider error, illegal step count, empty titles,
        or forbidden medical/reward wording, response uses the PRD template with `source=template`.
        Successful provider drafts return `source=ai`. Late provider results are discarded server-side.
        Without AI_API_KEY the server uses a deterministic local provider (still `source=ai` when valid).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecomposeRequest" }
            example:
              title: 写完实验报告
              notes: 先写方法再写结果
      responses:
        "200":
          description: Editable stages (AI draft or template fallback)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecomposeResponse" }
              examples:
                ai:
                  summary: Provider success
                  value:
                    stages:
                      - title: 先准备好材料和时间
                      - title: 动手做：「写完实验报告」的一小步
                      - title: 检查一遍有没有漏掉的
                      - title: 按备注再收口一次
                      - title: 收个尾
                    source: ai
                template:
                  summary: 8s degrade / invalid provider output
                  value:
                    stages:
                      - title: 先准备
                      - title: 做一小段
                      - title: 收个尾
                    source: template
        "400":
          description: Invalid JSON, extra fields, or title/notes length

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Account:
      type: object
      required: [id, nickname, inviteCode, createdAt]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        inviteCode: { type: string }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [accessToken, expiresAt, account, created]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        created: { type: boolean }
        account: { $ref: "#/components/schemas/Account" }
    FriendListItem:
      type: object
      required: [friendshipId, accountId, nickname, since]
      properties:
        friendshipId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        nickname: { type: string }
        since: { type: string, format: date-time }
    AddFriendResponse:
      type: object
      required: [friend, alreadyFriends]
      properties:
        friend: { $ref: "#/components/schemas/FriendListItem" }
        alreadyFriends: { type: boolean }
    StageProgress:
      type: string
      enum: [pending, done, skipped]
    RewardInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 80 }
        link: { type: string, maxLength: 500, description: http or https }
    StageInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 40 }
        progress:
          allOf:
            - { $ref: "#/components/schemas/StageProgress" }
          description: Defaults to pending when omitted
        remindAt:
          type: string
          format: date-time
          description: Optional stage reminder (RFC3339). Must be ≤ task dueAt when both set (400 otherwise).
    CreateTaskInput:
      type: object
      required: [title, uploadConsent, stages, dueAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 40 }
        notes: { type: string, maxLength: 500 }
        uploadConsent: { type: boolean }
        dueAt:
          type: string
          format: date-time
          description: Required task end time (RFC3339). Synced; local notification on device.
        stages:
          type: array
          minItems: 3
          maxItems: 7
          items: { $ref: "#/components/schemas/StageInput" }
        stageRewards:
          type: object
          additionalProperties: { $ref: "#/components/schemas/RewardInput" }
          description: "Keys are stage positions as decimal strings \"1\"..\"7\""
        completionReward:
          allOf:
            - { $ref: "#/components/schemas/RewardInput" }
          description: Optional. If designatedVerifierAccountId is set and omitted, server creates a "Task completion" gate reward.
        designatedVerifierAccountId: { type: string, format: uuid }
    PatchTaskInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 40 }
        notes: { type: string, maxLength: 500 }
        dueAt: { type: string, format: date-time }
        stages:
          type: array
          minItems: 3
          maxItems: 7
          items: { $ref: "#/components/schemas/StageInput" }
          description: Full stage list when updating progress/titles/remindAt; stage ids stay stable by position
        stageRewards:
          type: object
          additionalProperties: { $ref: "#/components/schemas/RewardInput" }
        completionReward: { $ref: "#/components/schemas/RewardInput" }
        clearCompletionReward:
          type: boolean
          description: Forbidden (400) when designated verifier is set
    RewardView:
      type: object
      required: [id, text, redeemState]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        link: { type: string }
        redeemState:
          type: string
          enum: [unrequested, pending, approved, rejected, self_redeemed]
    StageView:
      type: object
      required: [id, position, title, progress]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, maximum: 7 }
        title: { type: string }
        progress: { $ref: "#/components/schemas/StageProgress" }
        remindAt: { type: string, format: date-time }
        reward: { $ref: "#/components/schemas/RewardView" }
    TaskView:
      type: object
      required: [id, title, notes, status, dueAt, uploadConsentAt, createdAt, updatedAt, stages]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        notes: { type: string }
        status: { type: string, enum: [active, completed] }
        designatedVerifierAccountId: { type: string, format: uuid }
        dueAt: { type: string, format: date-time }
        uploadConsentAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StageView" }
        completionReward: { $ref: "#/components/schemas/RewardView" }
    InboxItem:
      type: object
      description: Verifier view — never includes task notes
      required: [requestId, rewardId, attempt, status, note, applicantNickname, taskTitle, rewardText, createdAt]
      properties:
        requestId: { type: string, format: uuid }
        rewardId: { type: string, format: uuid }
        attempt: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        note: { type: string }
        screenshotKey: { type: string, description: opaque key from upload }
        screenshotUrl: { type: string, description: relative path /v1/screenshots/{key} for convenience }
        applicantNickname: { type: string }
        taskTitle: { type: string }
        stageTitle: { type: string, description: nil/omitted means task completion reward }
        rewardText: { type: string }
        rewardLink: { type: string }
        createdAt: { type: string, format: date-time }
    OutboxItem:
      type: object
      required: [requestId, rewardId, attempt, status, note, createdAt, taskTitle, rewardText]
      properties:
        requestId: { type: string, format: uuid }
        rewardId: { type: string, format: uuid }
        attempt: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        note: { type: string }
        resolutionNote: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        taskTitle: { type: string }
        stageTitle: { type: string }
        rewardText: { type: string }
    Notice:
      type: object
      required: [id, kind, requestId, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [verification_pending, verification_approved, verification_rejected, verification_withdrawn]
        requestId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time }
    DecomposeRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 40 }
        notes: { type: string, maxLength: 500 }
    DecomposeStage:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 40 }
    DecomposeResponse:
      type: object
      required: [stages, source]
      properties:
        stages:
          type: array
          minItems: 3
          maxItems: 7
          items: { $ref: "#/components/schemas/DecomposeStage" }
        source:
          type: string
          enum: [ai, template]
          description: ai = provider draft; template = PRD §11.5 fallback (先准备/做一小段/收个尾)

    CreateReportRequest:
      type: object
      required: [requestId, reason]
      properties:
        requestId: { type: string, format: uuid }
        reason:
          type: string
          enum: [harassment, privacy, illegal_content, other]
          description: harassment=骚扰, privacy=隐私, illegal_content=违法内容, other=其他
        detail: { type: string, maxLength: 200, description: optional supplement }
    ReportReceipt:
      type: object
      required: [id, requestId, reason, createdAt, message]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        reason:
          type: string
          enum: [harassment, privacy, illegal_content, other]
        detail: { type: string }
        createdAt: { type: string, format: date-time }
        message: { type: string, example: 已收到 }

